version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: trainmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainmate
      POSTGRES_PASSWORD: trainmate
      POSTGRES_DB: trainmate
    ports:
      - "5432:5432"
    volumes:
      - trainmate-pg-data:/var/lib/postgresql/data
volumes:
  trainmate-pg-data:
